name: Daily KOSPI/KOSDAQ Screener V2.6

on:
  # cron 비활성화 — cron-job.org 외부 스케줄러가 트리거 (지연 거의 없음)
  # GitHub Actions의 schedule cron은 무료 티어에서 5~30분, 피크엔 1시간+ 지연됨
  # 셋업: README_AUTOMATION.md의 "외부 스케줄러" 섹션 참고
  # 참고: 평일 15:40 KST에 트리거 (정규장 마감 +10분)
  # schedule:
  #   - cron: '40 6 * * 1-5'
  workflow_dispatch:

# GitHub Pages 배포 권한
permissions:
  contents: write
  pages: write
  id-token: write

# 동시 실행 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # [V2.6] 코스피+코스닥 둘 다 돌리는 데 여유 있게 (실제 ~45분)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2.6 pipeline (KOSPI + KOSDAQ)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python run_all_v2_6.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # archive로 이동된 파일은 git rm으로 처리, 새로 생긴 latest/archive는 git add
          git add -A history.db snapshots/ docs/ archive/ latest_kospi_final.csv latest_kosdaq_final.csv 2>/dev/null || true
          # 혹시 archive 안 된 옛 v2_*.csv가 루트에 남아있다면 정리
          git add -A v2_kospi_*.csv v2_kosdaq_*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload artifacts (download from Actions UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-results-${{ github.run_id }}
          path: |
            v2_kospi_*.csv
            v2_kosdaq_*.csv
            snapshots/
            history.db
            docs/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: run-screener
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
