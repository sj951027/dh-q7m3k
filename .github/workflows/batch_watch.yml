# 배치 밖 미실행 감지 (2026-10-18 도입)
# ----------------------------------------------------------------------
# 이 워크플로는 스크리너를 "돌리지 않는다". 평일 밤, 이 저장소의 main 에
# '오늘(KST) 날짜의 docs/ 자동 push'가 있었는지만 본다. 없으면 텔레그램으로 한 줄.
#
# 왜 PC 밖에서 보나: 10/14 처럼 PC 가 재시작돼 배치가 통째로 안 돌면, PC 안의 어떤
# 알림도 같이 멈춘다. 배치가 성공할 때마다 docs/ 를 push 하므로(run_all_and_diversify.bat
# → run_and_diversify.git_push) 그 push 가 '오늘 완료 표식' 역할을 한다. 배치 코드 변경 없음.
#
# 건너뛰는 날: 토·일(KST) · skip_dates.txt 에 적힌 날(YYYYMMDD 한 줄에 하나 — 공휴일 등).
# 시각: 평일 23:27 KST = 14:27 UTC (배치는 20:10 시작·보통 21:30 전 push). 예약이 몇 시간 늦어도 '14시간 안 자동 push' 규칙이라 판단은 같다.
#   GitHub 예약은 몇 분~수십 분 늦을 수 있고, 매우 드물게 건너뛴다(그날은 알림도 없음 — 알림 없음 ≠ 정상).
#
# 준비(사용자가 한 번): 저장소 Settings → Secrets and variables → Actions 에
#   TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID 두 개를 등록(notify_telegram.py 가 쓰는 것과 같은 값).
#   토큰은 이 파일·로그에 찍히지 않는다(secrets 는 로그에서 가려짐).
# 수동 확인: Actions 탭 → 이 워크플로 → Run workflow (주말·skip 날이면 '건너뜀'만 찍고 끝).
# ----------------------------------------------------------------------
name: Batch watch (missed-run alert)

on:
  schedule:
    - cron: '27 14 * * 1-5'   # 월~금 14:27 UTC = 23:27 KST (:10 처럼 붐비는 분을 피함 — 10/19 첫 실행이 5시간 43분 늦게 발화한 실측)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (history for commit dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Decide (batch day, weekend, skip_dates, last auto push within 14h)
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Seoul
          # [2026-10-20 수정] GitHub 예약은 몇 시간 늦게 발화할 수 있다(10/19 첫 실행: 23:10 예약 → 04:53 발화 → '오늘' 기준 판단이 가짜 ⚠️).
          #   그래서 ① 배치 날짜 = (지금 − 6시간)의 KST 날짜(새벽 발화도 전날 배치로 봄) ② 판정 = '지금부터 14시간 안에' 배치 자동 커밋이 있었나.
          BATCH_DAY=$(date -d '-6 hours' +%Y%m%d)
          DOW=$(date -d '-6 hours' +%u)          # 1=월 … 7=일
          NOW_EPOCH=$(date +%s)
          echo "today=$BATCH_DAY" >> "$GITHUB_OUTPUT"
          if [ "$DOW" -ge 6 ]; then
            echo "verdict=skip_weekend" >> "$GITHUB_OUTPUT"; echo "weekend ($BATCH_DAY) - skip"; exit 0
          fi
          if [ -f skip_dates.txt ] && grep -qx "$BATCH_DAY" skip_dates.txt; then
            echo "verdict=skip_listed" >> "$GITHUB_OUTPUT"; echo "$BATCH_DAY is in skip_dates.txt - skip"; exit 0
          fi
          # 배치 자동 커밋('Auto update YYYY-MM-DD HH:MM', docs/ 변경)의 마지막 시각 — 사용자의 수동 docs 커밋은 메시지로 거른다.
          LAST_EPOCH=$(git log -1 --grep='^Auto update' --format='%at' -- docs/ || true)
          LAST_KST=$(git log -1 --grep='^Auto update' --format='%ad' --date=format-local:'%Y%m%d %H:%M' -- docs/ || true)
          echo "last auto push (KST): ${LAST_KST:-none}"
          echo "last=${LAST_KST:-none}" >> "$GITHUB_OUTPUT"
          AGE_H=$(( (NOW_EPOCH - ${LAST_EPOCH:-0}) / 3600 ))
          echo "age of last auto push: ${AGE_H}h (limit 14h) · batch day $BATCH_DAY"
          if [ -n "${LAST_EPOCH:-}" ] && [ "$AGE_H" -lt 14 ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"; echo "auto push within 14h - OK"
          else
            echo "verdict=missed" >> "$GITHUB_OUTPUT"; echo "no auto push within 14h - MISSED"
          fi

      - name: Telegram alert (only when missed)
        if: steps.decide.outputs.verdict == 'missed'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ steps.decide.outputs.today }}
          LAST: ${{ steps.decide.outputs.last }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret 이 없어 알림을 못 보냄 (감지 결과: MISSED $TODAY)"; exit 0
          fi
          D="${TODAY:4:2}/${TODAY:6:2}"
          MSG="⚠️ 스크리너 배치 미실행 감지(PC 밖 확인): $D 배치의 자동 push 가 14시간 안에 없어요. 마지막 자동 push: ${LAST}. PC 가 꺼졌거나 재시작 뒤 로그인 안 된 상태일 수 있어요. 일부러 건너뛴 날이면 skip_dates.txt 에 ${TODAY} 를 적어 두세요."
          curl -sS -o /dev/null -w "telegram http %{http_code}\n" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${MSG}" \
            "https://api.telegram.org/bot${TOKEN}/sendMessage"
